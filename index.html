const rock=new THREE.MeshStandardMaterial({color:0x626e6a,roughness:1,flatShading:false}),moss=new THREE.MeshStandardMaterial({color:0x4f6555,roughness:1}),stone=new THREE.MeshStandardMaterial({color:0x9c9f91,roughness:.94}),darkstone=new THREE.MeshStandardMaterial({color:0x737d77,roughness:1}),leaves=new THREE.MeshStandardMaterial({color:0x315b50,roughness:1}),bark=new THREE.MeshStandardMaterial({color:0x5b5147,roughness:1}),gold=new THREE.MeshStandardMaterial({color:0xc5a97b,metalness:.5,roughness:.44});
let seed=140123;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function mesh(parent,geometry,material,x=0,y=0,z=0){const o=new THREE.Mesh(geometry,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// Layered displaced island geometry — terrain and underside are genuinely 3D.

// Semi-transparent shader water - animated normals and believable surface reflections.
const waterMat=new THREE.ShaderMaterial({transparent:true,side:THREE.DoubleSide,depthWrite:false,uniforms:{t:{value:0},awake:{value:0}},vertexShader:`varying vec2 vUv;varying vec3 vPos;uniform float t;void main(){vUv=uv;vec3 p=position;p.y+=.38*sin(p.x*.22+t*1.6)+.26*cos(p.z*.38+t*1.15)+.16*sin((p.x+p.z)*.5+t*1.9);vPos=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,fragmentShader:`varying vec2 vUv;varying vec3 vPos;uniform float t;uniform float awake;void main(){float ripple=sin(vPos.x*.46+t*2.2)*cos(vPos.z*.29-t*1.6);float highlights=pow(max(.0,ripple*.5+.5),5.);vec3 col=mix(vec3(.06,.23,.29),vec3(.40,.72,.75),highlights*.5);col+=vec3(.15,.17,.18)*awake*.18;gl_FragColor=vec4(col,.86);}`});
const pool=mesh(main,new THREE.PlaneGeometry(25,17,60,50),waterMat,-2,1.3,31);pool.rotation.x=-Math.PI/2;
const fallMat=new THREE.ShaderMaterial({transparent:true,side:THREE.DoubleSide,depthWrite:false,uniforms:{t:{value:0}},vertexShader:`varying vec2 uvv;varying vec3 pos;uniform float t;void main(){uvv=uv;vec3 p=position;p.x+=sin(p.y*.22+t*1.1)*.34;p.z+=cos(p.y*.31+t*.8)*.20;pos=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,fragmentShader:`varying vec2 uvv;uniform float t;void main(){float streak=sin(uvv.x*40.+sin(uvv.y*32.+t*3.))*sin(uvv.y*62.-t*8.);float c=clamp(.56+streak*.18,0.,1.);float edge=smoothstep(0.,.12,uvv.x)*(1.-smoothstep(.85,1.,uvv.x));gl_FragColor=vec4(vec3(.47,.75,.80)*c,edge*.72);}`});

const skyStars=new Float32Array(1900*3);for(let i=0;i<1900;i++){skyStars[i*3]=(rand()-.5)*1300;skyStars[i*3+1]=80+rand()*400;skyStars[i*3+2]=(rand()-.5)*1300}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(skyStars,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xf6e6d7,size:1.2,transparent:true,opacity:.47}));scene.add(stars);

let awakening=-100,magical=0;const veil=document.getElementById('veil');function awaken(){awakening=performance.now()/1000;magical=1;}document.getElementById('magic').onclick=awaken;document.getElementById('home').onclick=()=>{camera.position.set(15,22,72);controls.target.set(0,9,0);awakening=-100;magical=0;creature.visible=false;};document.getElementById('hide').onclick=()=>document.body.classList.toggle('immersed');
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyM')awaken()});addEventListener('keyup',e=>keys[e.code]=false);let previous=performance.now();function frame(ms){requestAnimationFrame(frame);let dt=Math.min((ms-previous)/1000,.055);previous=ms;const t=ms/1000;controls.update();const fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();const motion=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)motion.add(fwd);if(keys.KeyS||keys.ArrowDown)motion.sub(fwd);if(keys.KeyD||keys.ArrowRight)motion.add(right);if(keys.KeyA||keys.ArrowLeft)motion.sub(right);if(keys.Space)motion.y+=1;if(keys.ShiftLeft||keys.ShiftRight)motion.y-=1;if(motion.lengthSq()>0){motion.normalize().multiplyScalar(dt*(keys.ControlLeft?60:25));camera.position.add(motion);controls.target.add(motion)}waterMat.uniforms.t.value=t;fallMat.uniforms.t.value=t;cloudMat.uniforms.t.value=t;fire.rotation.y=t*.006;const age=t-awakening,active=age>0&&age<19;const strength=active?Math.sin(Math.PI*Math.min(1,age/19))**2:0;creature.visible=active;if(active){creature.position.set(-280+age*31,75+Math.sin(age*.5)*10,-135);creature.scale.setScalar(.95+strength*.6);creature.rotation.z=Math.sin(t*.8)*.04;creature.children.forEach(x=>{if(x.name==='fin1')x.rotation.y=Math.sin(t*1.7)*.15;if(x.name==='fin2')x.rotation.y=-Math.sin(t*1.7)*.15})}waterMat.uniforms.awake.value=strength;sun.intensity=3+strength*1.1;aura.intensity=10+strength*22;stars.material.opacity=.47+strength*.42;veil.style.opacity=String(Math.max(0,.38*Math.sin(Math.min(1,age/3)*Math.PI))*(active?1:0));renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading'
